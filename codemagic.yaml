workflows:
android-build:
name: My Ledger Android Build
max_build_duration: 60

```
environment:
  flutter: stable

scripts:
  - name: Get Flutter packages
    script: |
      flutter pub get

  - name: Generate app icons
    script: |
      dart run flutter_launcher_icons

  - name: Build Android APK
    script: |
      flutter build apk --release

  - name: Prepare APK artifact
    script: |
      mkdir -p artifacts

      APK_PATH=$(find . -type f -name "app-release.apk" | head -n 1)

      if [ -z "$APK_PATH" ]; then
        echo "ERROR: app-release.apk not found"
        find . -type f -name "*.apk" -print
        exit 1
      fi

      echo "APK found at: $APK_PATH"
      cp "$APK_PATH" artifacts/app-release.apk
      ls -lh artifacts/app-release.apk

artifacts:
  - artifacts/app-release.apk
```
