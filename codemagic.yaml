workflows:
  android-build:
    name: My Ledger Android Build
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate app icons
        script: |
          dart run flutter_launcher_icons

      - name: Build Android APK
        script: |
          set +e

          flutter build apk --release
          BUILD_STATUS=$?

          echo "Flutter build exit code: $BUILD_STATUS"

          APK_PATH=$(find . -type f -name "app-release.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: app-release.apk not found"
            echo "Searching for all APK files:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found at: $APK_PATH"

          mkdir -p artifacts
          cp "$APK_PATH" artifacts/app-release.apk

          echo "Final APK:"
          ls -lh artifacts/app-release.apk

          echo "APK generated successfully."
          exit 0

    artifacts:
      - artifacts/app-release.apk
